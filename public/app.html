<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tournaments — Veridict</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<style>
.tcard{
  display:block;text-decoration:none;background:var(--card);
  border:1px solid var(--rule-soft);border-left:3px solid var(--ink);
  border-radius:3px;padding:18px 20px;box-shadow:var(--shadow);
}
.tcard:hover{border-left-color:var(--claret)}
.tcard h3{margin-bottom:3px}
.tcard .meta{
  display:flex;gap:16px;margin-top:12px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-faint);
}
</style>
</head>
<body>
<div class="shell">
  <header class="masthead" id="masthead"></header>

  <div class="spread mt-3">
    <div>
      <span class="eyebrow" id="greeting"></span>
      <h1>Tournaments</h1>
    </div>
    <a class="btn hide" id="new-btn" href="/tab">Open tab room</a>
  </div>

  <div class="notice" id="error" hidden></div>

  <div class="mt-3" id="list"><p class="muted">Loading…</p></div>

  <footer class="footer">Veridict</footer>
</div>

<script src="/js/app.js"></script>
<script>
(async () => {
  const user = await requireUser();
  if (!user) return;
  await mountNav('/app');

  const hour = new Date().getHours();
  $('#greeting').textContent =
    (hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening')
    + ', ' + user.display_name.split(' ')[0];

  if (user.role === 'admin') $('#new-btn').classList.remove('hide');

  try {
    const { tournaments } = await api.get('/tournaments');

    if (!tournaments.length) {
      $('#list').innerHTML = `
        <div class="empty">
          <h3>No tournaments yet</h3>
          <p>${user.role === 'admin'
              ? 'Create one in the tab room to start scheduling rounds.'
              : 'An organiser will add you to a tournament when one opens.'}</p>
          ${user.role === 'admin' ? '<a class="btn" href="/tab">Open tab room</a>' : ''}
        </div>`;
      return;
    }

    $('#list').innerHTML = `<div class="grid two">` + tournaments.map(t => `
      <a class="tcard" href="/tournament?id=${t.id}">
        <span class="eyebrow">${esc(t.format_name)}</span>
        <h3>${esc(t.name)}</h3>
        <p class="small muted" style="margin:0">${esc(t.host || 'Independent')}</p>
        <div class="meta">
          <span>${t.team_count} teams</span>
          <span>${t.round_count} ${t.round_count === 1 ? 'round' : 'rounds'}</span>
        </div>
      </a>`).join('') + `</div>`;
  } catch (err) {
    showError(err.message);
  }
})();
</script>
</body>
</html>
