<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My speeches — Veridict</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<style>
.speech{
  background:var(--card);border:1px solid var(--rule-soft);
  border-left:3px solid var(--ink);border-radius:3px;
  padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow);
}
.speech .motion{
  font-family:var(--display);font-size:16px;font-weight:600;
  margin:6px 0 12px;line-height:1.3;
}
.speech .motion::before{content:"“"} .speech .motion::after{content:"”"}
audio{width:100%;margin:4px 0 14px;height:38px}
.fb{padding:12px 15px;background:var(--paper);border-left:2px solid var(--sage);margin-bottom:9px}
.fb.change{border-left-color:var(--amber)}
.fb b{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink);display:block;margin-bottom:4px;
}
.fb p{margin:0;font-size:13.5px;color:var(--ink-soft);line-height:1.6}
.expires{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-faint);
}
.del{
  background:none;border:none;padding:0;cursor:pointer;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--claret);text-decoration:underline;
}
</style>
</head>
<body>
<div class="shell">
  <header class="masthead" id="masthead"></header>

  <div class="mt-3">
    <span class="eyebrow">Your record</span>
    <h1>My speeches</h1>
    <p class="lede">Recordings of your own speeches with the feedback judges wrote
      about them. Only you and the judges who heard the round can play these.</p>
  </div>

  <div class="notice" id="error" hidden></div>
  <div class="mt-3" id="list"><p class="muted">Loading…</p></div>

  <footer class="footer">Veridict</footer>
</div>

<script src="/js/app.js"></script>
<script>
(async () => {
  const user = await requireUser();
  if (!user) return;
  await mountNav('/me');

  const fmtDate = s => new Date(s).toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' });
  const daysLeft = s => Math.max(0, Math.ceil((new Date(s) - Date.now()) / 864e5));

  try {
    const { recordings } = await api.get('/recordings/mine');

    if (!recordings.length) {
      $('#list').innerHTML = `
        <div class="empty">
          <h3>No recordings yet</h3>
          <p>Speeches appear here after a judge records a round you spoke in,
             and only if your recording consent is on file.</p>
        </div>`;
      return;
    }

    // Feedback is readable once the round is closed, so pull each round's
    // results and match the written notes to the speech.
    const cards = [];
    for (const r of recordings) {
      let notes = [];
      try {
        const res = await api.get(`/rounds/${r.round_id}/results`);
        notes = res.reasons || [];
      } catch { /* round still open — audio only */ }

      cards.push(`
        <div class="speech">
          <div class="spread">
            <span class="eyebrow">${esc(r.tournament_name)} · Round ${r.sequence}</span>
            ${r.expires_at
              ? `<span class="expires">Kept ${daysLeft(r.expires_at)} more days</span>` : ''}
          </div>
          <p class="motion">${esc(r.motion)}</p>
          <audio controls preload="none" src="/api/recordings/${r.id}/audio"></audio>
          ${notes.length ? notes.map(n => `
            <div class="fb"><b>${esc(n.judge)} — reason for decision</b>
              <p>${esc(n.reasoning)}</p></div>`).join('')
            : '<p class="small muted">Feedback appears once the round is closed.</p>'}
          <div class="spread mt-1">
            <span class="expires">Recorded ${fmtDate(r.created_at)}</span>
            <button class="del" data-id="${r.id}">Delete this recording</button>
          </div>
        </div>`);
    }
    $('#list').innerHTML = cards.join('');

    $$('.del').forEach(b => b.onclick = async () => {
      if (!confirm('Delete this recording permanently?')) return;
      try {
        await api.del('/recordings/' + b.dataset.id);
        b.closest('.speech').remove();
      } catch (e) { showError(e.message); }
    });

  } catch (err) {
    showError(err.message);
  }
})();
</script>
</body>
</html>
