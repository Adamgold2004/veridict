<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tournament — Veridict</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<style>
.cols{display:grid;grid-template-columns:1fr 320px;gap:38px;align-items:start}
.round{
  background:var(--card);border:1px solid var(--rule-soft);
  border-left:3px solid var(--rule);border-radius:3px;
  padding:16px 18px;margin-bottom:11px;box-shadow:var(--shadow);
}
.round.live{border-left-color:var(--claret)}
.round.completed{border-left-color:var(--sage)}
.round .motion{
  font-family:var(--display);font-size:16px;font-weight:600;
  margin:5px 0 10px;line-height:1.3;
}
.round .actions{display:flex;gap:8px;flex-wrap:wrap}
.team{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:9px 0;border-bottom:1px solid var(--rule-soft);font-size:13.5px;
}
.team:last-child{border-bottom:none}
.team .who{font-size:11.5px;color:var(--ink-faint);display:block}
@media (max-width:860px){.cols{grid-template-columns:1fr;gap:28px}}
</style>
</head>
<body>
<div class="shell">
  <header class="masthead" id="masthead"></header>

  <div class="mt-3">
    <span class="eyebrow" id="kicker">Tournament</span>
    <h1 id="tname">…</h1>
    <p class="muted" id="thost"></p>
  </div>

  <div class="notice" id="error" hidden></div>

  <div class="cols mt-3">
    <main>
      <div class="section-head">
        <h2>Rounds</h2>
        <a class="eyebrow hide" id="add-round" href="#" style="text-decoration:none">+ New round</a>
      </div>
      <div id="rounds"></div>
    </main>

    <aside>
      <div class="section-head"><h2>Teams</h2></div>
      <div class="card" id="teams"></div>

      <div class="section-head mt-3"><h2>Standings</h2></div>
      <div class="card" id="standings"></div>
    </aside>
  </div>

  <footer class="footer">Veridict</footer>
</div>

<script src="/js/app.js"></script>
<script>
(async () => {
  const user = await requireUser();
  if (!user) return;
  await mountNav('/app');

  const id = qs('id');
  if (!id) { location.href = '/app'; return; }
  if (user.role === 'admin') {
    const a = $('#add-round');
    a.classList.remove('hide');
    a.href = '/tab?tournament=' + id;
  }

  try {
    const { tournament, teams, rounds } = await api.get('/tournaments/' + id);

    $('#kicker').textContent = tournament.format_name;
    $('#tname').textContent  = tournament.name;
    $('#thost').textContent  = tournament.host || '';
    document.title = tournament.name + ' — Veridict';

    // ---- rounds ----
    $('#rounds').innerHTML = rounds.length ? rounds.map(r => {
      const canJudge  = ['live','judging'].includes(r.status);
      const canResult = r.status === 'completed' || user.role === 'admin';
      return `
        <div class="round ${esc(r.status)}">
          <div class="spread">
            <span class="eyebrow">Round ${r.sequence} · ${esc(r.stage.replace('_',' '))}${r.room ? ' · ' + esc(r.room) : ''}</span>
            <span class="pill ${esc(r.status)}">${esc(r.status)}</span>
          </div>
          <p class="motion">${esc(r.motion)}</p>
          <div class="actions">
            ${canJudge ? `<a class="btn small" href="/ballot?round=${r.id}">Open ballot</a>` : ''}
            ${canResult ? `<a class="btn ghost small" href="/results?round=${r.id}">Results</a>` : ''}
            ${user.role === 'admin' ? `<a class="btn ghost small" href="/tab?round=${r.id}">Manage</a>` : ''}
          </div>
        </div>`;
    }).join('') : `<div class="empty"><h3>No rounds scheduled</h3>
        <p>Rounds appear here once the tab room creates them.</p></div>`;

    // ---- teams ----
    $('#teams').innerHTML = teams.length ? teams.map(t => `
      <div class="team">
        <div>
          <b>${esc(t.name)}</b>
          <span class="who">${t.members.map(m => esc(m.display_name)).join(' · ') || 'No speakers listed'}</span>
        </div>
        <span class="eyebrow">${esc(t.institution || '')}</span>
      </div>`).join('') : '<p class="muted small" style="margin:0">No teams registered.</p>';

    // ---- standings ----
    const { standings } = await api.get(`/tournaments/${id}/standings`);
    const scored = standings.filter(s => s.ballots > 0);
    $('#standings').innerHTML = scored.length ? `
      <table>
        <thead><tr><th>Team</th><th style="text-align:right">Pts</th></tr></thead>
        <tbody>${scored.map(s => `
          <tr><td>${esc(s.name)}</td><td class="n">${s.points}</td></tr>`).join('')}
        </tbody>
      </table>`
      : '<p class="muted small" style="margin:0">Standings appear once ballots are in.</p>';

  } catch (err) {
    showError(err.message);
  }
})();
</script>
</body>
</html>
